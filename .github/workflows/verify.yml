name: verify

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: verify-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-boot:
        name: build-and-boot
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Install build tools
              run: |
                  sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils gcc grub-common grub-pc-bin make mtools qemu-system-x86 xorriso
            - name: Install the Rust bare-metal target
              run: rustup target add x86_64-unknown-none
            - name: Record QEMU fixture capabilities
              run: |
                  qemu-system-x86_64 -version
                  qemu-system-x86_64 -device qemu-xhci,help
                  qemu-system-x86_64 -device usb-kbd,help
                  qemu-system-x86_64 -device nvme,help
            - name: Capture Sapote First Light from QEMU
              run: |
                  make iso
                  python3 tools/capture-first-light.py \
                      --iso build/sapote.iso \
                      --output build/first-light-captures
            - name: Upload Sapote First Light captures
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: sapote-first-light-captures
                  path: build/first-light-captures
                  if-no-files-found: error
            - name: Verify the kernel artifact
              run: make verify
            - name: Prove faults and interrupts in QEMU
              run: make qemu-tests
