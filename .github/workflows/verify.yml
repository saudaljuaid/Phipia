name: verify

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: verify-${{ github.ref }}
    cancel-in-progress: true

jobs:
    sapstudio-foundation:
        name: sapstudio-foundation
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Install the bare-metal Rust target
              run: rustup target add x86_64-unknown-none
            - name: Verify the mirrored SapStudio foundation
              run: make -C userspace/sapstudio verify

    build-and-boot:
        name: build-and-boot
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Install build tools
              run: |
                  sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils ffmpeg gcc grub-common grub-pc-bin make mtools \
                      qemu-system-x86 xorriso
            - name: Install the Rust bare-metal target
              run: rustup target add x86_64-unknown-none
            - name: Record QEMU fixture capabilities
              run: |
                  qemu-system-x86_64 -version
                  qemu-system-x86_64 -device qemu-xhci,help
                  qemu-system-x86_64 -device usb-kbd,help
                  qemu-system-x86_64 -device nvme,help
            - name: Verify the kernel artifact
              run: make verify
            - name: Capture Sapote First Environment from QEMU
              run: |
                  make iso
                  python3 tools/capture-first-environment.py \
                      --iso build/sapote.iso \
                      --system build/userspace/sapote-system-fat32.raw \
                      --data build/userspace/sapote-data-fat32.raw \
                      --output build/first-environment-captures \
                      --ffmpeg ffmpeg
                  python3 tools/fat32_image.py inspect \
                      build/first-environment-captures/sapote-first-environment-data.raw \
                      --report build/first-environment-captures/fat32-report.json
            - name: Upload Sapote First Environment captures
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: sapote-first-environment-captures
                  path: build/first-environment-captures
                  if-no-files-found: error
            - name: Prove faults and interrupts in QEMU
              run: |
                  make qemu-test-first-light-userland-interactive
                  make qemu-test-fat32-data
                  make qemu-test-fat32-nested qemu-test-fat32-growth \
                      qemu-test-fat32-random qemu-test-fat32-truncate \
                      qemu-test-fat32-rename qemu-test-fat32-delete \
                      qemu-test-fat32-full qemu-test-fat32-corrupt \
                      qemu-test-fat32-missing qemu-test-fat32-persistence \
                      qemu-test-fat32-cache qemu-test-fat32-immutable \
                      qemu-test-fat32-handles
                  make qemu-tests
